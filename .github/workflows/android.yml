name: Android APK

on:
  push:
    branches: [main, 'claude/**']
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx jest --ci
      - run: npx expo lint

  build:
    needs: check
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
      - name: Build release APK
        working-directory: android
        # arm64 only: covers practically every Android phone from the last ~8 years and halves build time.
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a
      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk habit-tracker.apk
      - uses: actions/upload-artifact@v4
        with:
          name: habit-tracker-apk
          path: habit-tracker.apk
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" habit-tracker.apk \
            --target "${{ github.sha }}" \
            --title "Habit Tracker build ${{ github.run_number }}" \
            --notes "Built from ${{ github.ref_name }} @ ${GITHUB_SHA::7}. Install habit-tracker.apk on your phone." \
            --latest
